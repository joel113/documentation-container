apiVersion: 1

datasources:
- name: Prometheus
  type: prometheus
  uid: prometheus
  access: proxy
  orgId: 1
  url: http://prometheus:9090
  basicAuth: false
  isDefault: false
  version: 1
  editable: false
  jsonData:
    httpMethod: GET
- name: Tempo
  type: tempo
  access: proxy
  orgId: 1
  url: http://tempo:3200
  basicAuth: false
  isDefault: true
  version: 1
  editable: false
  apiVersion: 1
  uid: tempo
  jsonData:
    httpMethod: GET
    serviceMap:
      datasourceUid: prometheus
    streamingEnabled:
      search: true
- name: Loki
  type: loki
  access: proxy
  url: http://loki:3100
  isDefault: false
  editable: true
  jsonData:
    maxLines: 1000
    derivedFields:
      # Link logs to traces in Tempo using trace_id
      - name: trace_id
        matcherRegex: '"trace_id":"([^"]*)"'
        url: /explore?left={"datasource":"Tempo","queries":[{"refId":"A","queryType":"traceql","expr":"$${__value.raw}"}]}
        datasourceUid: tempo-uid  # Replace with actual Tempo datasource UID
        urlDisplayLabel: View trace
